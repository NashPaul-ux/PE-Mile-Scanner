<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PE Mile Timer</title>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 34px;
  margin-bottom: 5px;
}

#connection {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 20px;
}

.controls {
  margin: 15px auto;
}

select {
  font-size: 20px;
  padding: 10px;
  margin: 5px;
}

#timer {
  font-size: 70px;
  font-weight: bold;
  margin: 25px 0;
  font-family: monospace;
}

button {
  font-size: 22px;
  padding: 15px 25px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#start {
  background: #2e7d32;
  color: white;
}

#reset {
  background: #c62828;
  color: white;
}

#scanner {
  background: #1565c0;
  color: white;
}

#status {
  font-size: 22px;
  margin: 20px;
  min-height: 30px;
}

#results {
  max-width: 600px;
  margin: 20px auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: left;
}

.result {
  font-size: 19px;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

#count {
  font-size: 20px;
  font-weight: bold;
}

</style>

</head>

<body>

<h1>PE MILE TIMER</h1>

<div id="connection">
  ● ONLINE
</div>

<div class="controls">

  <label>Period:</label>

  <select id="period">
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
    <option>5</option>
    <option>6</option>
    <option>7</option>
  </select>

  <label>Mile:</label>

  <select id="mile">
    <option>1</option>
    <option>2</option>
    <option>3</option>
  </select>

</div>

<div id="timer">
  00:00.00
</div>

<button id="start" onclick="startTimer()">
  START MILE
</button>

<button id="reset" onclick="resetTimer()">
  RESET
</button>

<div id="status"></div>

<div id="count">
  Results Saved: 0
</div>

<div id="results">

  <h2>Finishers</h2>

  <div id="list"></div>

</div>

<script>

let startTime = null;
let running = false;
let timerInterval = null;

let results = [];


// ----------------------------------
// LOAD SAVED RESULTS
// ----------------------------------

function loadResults() {

  const saved = localStorage.getItem("peMileResults");

  if (saved) {
    results = JSON.parse(saved);
  }

  displayResults();
}


// ----------------------------------
// SAVE RESULTS LOCALLY
// ----------------------------------

function saveResults() {

  localStorage.setItem(
    "peMileResults",
    JSON.stringify(results)
  );

}


// ----------------------------------
// TIMER
// ----------------------------------

function startTimer() {

  if (running) return;

  startTime = Date.now();

  running = true;

  document.getElementById("start").innerText =
    "RUNNING...";

  timerInterval = setInterval(
    updateTimer,
    10
  );

}


function updateTimer() {

  if (!running) return;

  const elapsed =
    Date.now() - startTime;

  displayTime(elapsed);

}


function displayTime(elapsed) {

  const minutes =
    Math.floor(elapsed / 60000);

  const seconds =
    Math.floor(
      (elapsed % 60000) / 1000
    );

  const hundredths =
    Math.floor(
      (elapsed % 1000) / 10
    );

  document.getElementById("timer").innerText =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0") +
    "." +
    String(hundredths).padStart(2, "0");

}


// ----------------------------------
// RESET TIMER
// ----------------------------------

function resetTimer() {

  if (
    results.length > 0 &&
    !confirm(
      "Reset the timer? Saved results will remain."
    )
  ) {
    return;
  }

  running = false;

  clearInterval(timerInterval);

  startTime = null;

  document.getElementById("timer").innerText =
    "00:00.00";

  document.getElementById("start").innerText =
    "START MILE";

  document.getElementById("status").innerText =
    "";

}


// ----------------------------------
// SAVE A FINISH
// ----------------------------------

function recordFinish(
  firstName,
  lastName,
  grade
) {

  if (!running) {

    document.getElementById("status").innerText =
      "Start the mile first.";

    return;

  }

  const elapsed =
    Date.now() - startTime;

  const minutes =
    Math.floor(elapsed / 60000);

  const seconds =
    Math.floor(
      (elapsed % 60000) / 1000
    );

  const hundredths =
    Math.floor(
      (elapsed % 1000) / 10
    );

  const timeString =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0") +
    "." +
    String(hundredths).padStart(2, "0");


  const record = {

    date:
      new Date().toISOString(),

    period:
      document.getElementById("period").value,

    mile:
      document.getElementById("mile").value,

    firstName:
      firstName,

    lastName:
      lastName,

    grade:
      grade,

    time:
      timeString,

    seconds:
      elapsed / 1000

  };


  results.push(record);

  saveResults();

  displayResults();


  document.getElementById("status").innerText =
    firstName +
    " " +
    lastName +
    " — " +
    timeString +
    " RECORDED";

}


// ----------------------------------
// DISPLAY RESULTS
// ----------------------------------

function displayResults() {

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  results.forEach(
    function(result, index) {

      const row =
        document.createElement("div");

      row.className = "result";

      row.innerText =
        (index + 1) +
        ". " +
        result.firstName +
        " " +
        result.lastName +
        " — " +
        result.time;

      list.appendChild(row);

    }
  );


  document.getElementById("count").innerText =
    "Results Saved: " +
    results.length;

}


// ----------------------------------
// CONNECTION STATUS
// ----------------------------------

function updateConnectionStatus() {

  const connection =
    document.getElementById("connection");

  if (navigator.onLine) {

    connection.innerText =
      "● ONLINE";

  } else {

    connection.innerText =
      "● OFFLINE — RESULTS SAVED ON DEVICE";

  }

}


window.addEventListener(
  "online",
  updateConnectionStatus
);

window.addEventListener(
  "offline",
  updateConnectionStatus
);


// ----------------------------------
// STARTUP
// ----------------------------------

loadResults();

updateConnectionStatus();

</script>

</body>
</html>
